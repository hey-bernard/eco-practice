<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<meta name="description" content="작은 실천을 기록하면 숲이 자라는 생태 실천 웹앱">
<title>오늘의 실천</title>
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0&display=block" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
  // line-design-system.md(LDSG)의 토큰. 그린·블랙·그레이 세 축만 쓴다. LDSG에 다크 모드 토큰이 없어 라이트만 둔다.
  // 화면 코드는 Stitch 버전(../stitch)과 같은 토큰 이름을 쓰므로, 같은 이름에 LDSG 값을 넣었다.
  const G = {
    100: '#FCFCFC', 150: '#F5F5F5', 200: '#EFEFEF', 300: '#DFDFDF', 350: '#C8C8C8', 400: '#B7B7B7',
    500: '#949494', 600: '#777777', 700: '#555555', 800: '#303030', 900: '#111111'
  };
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          // 브랜드: LINE Green은 아이콘·표시·체크에, 흰 글자가 올라가는 버튼 채움은 대비 3:1을 넘는 brand-primary-alt로
          green: '#06C755', 'green-alt': '#04A647', negative: '#E8332E', link: '#2C7DFA', disabled: '#E4E4E4', gray: G,
          primary: G[900], 'primary-container': '#04A647', 'on-primary': '#FFFFFF',
          secondary: G[700], 'secondary-container': G[150], 'on-secondary-container': G[900],
          tertiary: G[900], 'tertiary-fixed': G[200], 'tertiary-fixed-dim': G[500],
          background: '#FFFFFF', surface: '#FFFFFF',
          'surface-container-lowest': '#FFFFFF', 'surface-container-low': G[150], 'surface-container': G[200],
          'surface-container-high': G[300], 'surface-container-highest': G[350],
          'on-surface': '#000000', 'on-surface-variant': G[700],
          outline: G[600], 'outline-variant': G[300], hairline: G[200],
          oat: G[150], amber: G[500], sage: G[300], done: G[150], sky: G[200], 'on-sky': G[900]
        },
        // 라운드: 3 배지 · 5 버튼(가장 흔함) · 7 카드 · 12 시트/팝업
        borderRadius: { DEFAULT: '5px', sm: '3px', md: '5px', '2xl': '7px', lg: '12px', xl: '12px', full: '9999px' },
        // 그림자: 놓이는 바탕(흰색/연회색)에 맞춰 고른다
        boxShadow: {
          'w-100': '0 0 2px rgb(0 0 0 / .07), 0 1px 2px rgb(0 0 0 / .07)', 'w-200': '0 1px 6px rgb(0 0 0 / .12)', 'w-300': '0 1px 20px rgb(0 0 0 / .07)',
          'g-100': '0 0 1px rgb(0 0 0 / .05), 0 1px 1px rgb(0 0 0 / .05)', 'g-200': '0 1px 4px rgb(0 0 0 / .06)', 'g-300': '0 1px 15px rgb(0 0 0 / .04)'
        },
        fontFamily: {
          // LDSG는 언어별 시스템 글꼴. 한국어는 LINE Seed KR(설치돼 있으면) → Pretendard 폴백 권장
          serif: ['"LINE Seed Sans KR"', '"LINE Seed KR"', '"Pretendard Variable"', 'Pretendard', '-apple-system', 'BlinkMacSystemFont', '"Helvetica Neue"', '"Segoe UI"', 'Roboto', 'sans-serif'],
          sans: ['"LINE Seed Sans KR"', '"LINE Seed KR"', '"Pretendard Variable"', 'Pretendard', '-apple-system', 'BlinkMacSystemFont', '"Helvetica Neue"', '"Segoe UI"', 'Roboto', 'sans-serif']
        },
        // 글자: Title 38/28/22/18/16/14 (빽빽한 줄간격), Text 18/16/14/12 (줄간격 1.5)
        fontSize: {
          'headline-xl': ['28px', { lineHeight: '1.28' }],  // title-xl
          'headline-lg': ['22px', { lineHeight: '1.3' }],   // title-l
          'headline-md': ['18px', { lineHeight: '1.33' }],  // title-m
          'title-s': ['16px', { lineHeight: '1.35' }],
          'title-xs': ['14px', { lineHeight: '1.4' }],
          quote: ['16px', { lineHeight: '1.5' }],
          'body-md': ['16px', { lineHeight: '1.5' }],       // text-m
          'body-sm': ['14px', { lineHeight: '1.5' }],       // text-s
          'label-md': ['12px', { lineHeight: '1.5' }],      // text-xs
          'label-sm': ['12px', { lineHeight: '1.4' }]
        }
      }
    }
  };
</script>
<link rel="stylesheet" href="../css/climate-chart.css">
<link rel="stylesheet" href="../css/achievements.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-white text-black font-sans antialiased">
<div class="relative mx-auto min-h-[100dvh] w-full max-w-[560px] bg-white">
  <main id="screen"></main>
  <div id="fab-slot"></div>
  <nav id="nav" aria-label="주 메뉴" class="fixed bottom-0 left-1/2 z-40 w-full max-w-[560px] -translate-x-1/2 border-t border-gray-200 bg-white"></nav>
  <div id="layer"></div>
</div>
<noscript>이 앱은 자바스크립트가 필요합니다.</noscript>
<script src="../js/achievements-widget.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
