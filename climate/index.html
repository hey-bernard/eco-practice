<script>
  // 라이트/다크: 지구 탭에서 직접 고르면 이 기기에 기억하고, 아니면 기기 설정을 따른다
  (function () {
    var mq = matchMedia('(prefers-color-scheme: dark)');
    function pick() { try { return localStorage.getItem('eco-climate-theme'); } catch (e) { return null; } }
    function apply() {
      var t = pick(), dark = t ? t === 'dark' : mq.matches;
      document.documentElement.classList.toggle('dark', dark);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.content = dark ? '#0f131d' : '#f4f7f3';
    }
    apply();
    mq.addEventListener('change', function () { if (!pick()) { apply(); window.dispatchEvent(new Event('themechange')); } });
    window.__applyTheme = apply;
  })();
</script>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
  // 색은 아래 <style>의 --c-* 변수(라이트 :root, 다크 .dark). html의 dark 클래스로 바꾼다.
  // Stitch 샘플 '지구 기후 모니터'(Action Guide·Climate Home 공통)의 다크 토큰.
  // 화면 코드는 Stitch 버전(../stitch)·기후 모니터 버전(../monitor)과 같은 이름의 토큰을 쓰므로, 같은 이름에 다크 값을 넣었다.
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          'primary': 'rgb(var(--c-primary) / <alpha-value>)',
          'primary-container': 'rgb(var(--c-primary-container) / <alpha-value>)',
          'on-primary': 'rgb(var(--c-on-primary) / <alpha-value>)',
          'on-primary-container': 'rgb(var(--c-on-primary-container) / <alpha-value>)',
          'secondary': 'rgb(var(--c-secondary) / <alpha-value>)',
          'secondary-container': 'rgb(var(--c-secondary-container) / <alpha-value>)',
          'on-secondary-container': 'rgb(var(--c-on-secondary-container) / <alpha-value>)',
          'tertiary': 'rgb(var(--c-tertiary) / <alpha-value>)',
          'tertiary-fixed': 'rgb(var(--c-tertiary-fixed) / <alpha-value>)',
          'tertiary-fixed-dim': 'rgb(var(--c-tertiary-fixed-dim) / <alpha-value>)',
          'background': 'rgb(var(--c-background) / <alpha-value>)',
          'surface': 'rgb(var(--c-surface) / <alpha-value>)',
          'surface-container-lowest': 'rgb(var(--c-surface-container-lowest) / <alpha-value>)',
          'surface-container-low': 'rgb(var(--c-surface-container-low) / <alpha-value>)',
          'surface-container': 'rgb(var(--c-surface-container) / <alpha-value>)',
          'surface-container-high': 'rgb(var(--c-surface-container-high) / <alpha-value>)',
          'surface-container-highest': 'rgb(var(--c-surface-container-highest) / <alpha-value>)',
          'surface-bright': 'rgb(var(--c-surface-bright) / <alpha-value>)',
          'on-surface': 'rgb(var(--c-on-surface) / <alpha-value>)',
          'on-surface-variant': 'rgb(var(--c-on-surface-variant) / <alpha-value>)',
          'outline': 'rgb(var(--c-outline) / <alpha-value>)',
          'outline-variant': 'rgb(var(--c-outline-variant) / <alpha-value>)',
          'hairline': 'rgb(var(--c-hairline) / <alpha-value>)',
          'oat': 'rgb(var(--c-oat) / <alpha-value>)',
          'amber': 'rgb(var(--c-amber) / <alpha-value>)',
          'sage': 'rgb(var(--c-sage) / <alpha-value>)',
          'done': 'rgb(var(--c-done) / <alpha-value>)',
          'sky': 'rgb(var(--c-sky) / <alpha-value>)',
          'on-sky': 'rgb(var(--c-on-sky) / <alpha-value>)',
          'error': 'rgb(var(--c-error) / <alpha-value>)'
        },
        borderRadius: { DEFAULT: '0.25rem', lg: '0.5rem', xl: '0.75rem', '2xl': '0.75rem', full: '9999px' },
        fontFamily: {
          serif: ['"Space Grotesk"', '"Noto Sans KR"', 'sans-serif'],
          sans: ['Inter', '"Noto Sans KR"', 'sans-serif'],
          mono: ['"JetBrains Mono"', '"Noto Sans KR"', 'monospace']
        },
        fontSize: {
          'headline-xl': ['28px', { lineHeight: '36px', letterSpacing: '-0.01em' }],
          'headline-lg': ['22px', { lineHeight: '28px' }],
          'headline-md': ['18px', { lineHeight: '24px' }],
          quote: ['16px', { lineHeight: '26px' }],
          'body-md': ['14px', { lineHeight: '20px' }],
          'body-sm': ['12px', { lineHeight: '16px' }],
          'label-md': ['12px', { lineHeight: '16px', letterSpacing: '0.02em' }],
          'label-sm': ['11px', { lineHeight: '14px', letterSpacing: '0.03em' }],
          metric: ['24px', { lineHeight: '32px', fontWeight: '700' }],
          'metric-lg': ['36px', { lineHeight: '44px', fontWeight: '700' }]
        }
      }
    }
  };
</script>
