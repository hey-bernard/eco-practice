<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7FBF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10140F" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="description" content="작은 실천을 기록하면 숲이 자라는 생태 실천 웹앱 · Android Material 3 스타일 버전">
<title>오늘의 실천 · Material 3</title>
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
  // Material 3 색 역할(초록 기준 색에서 뽑은 톤). 실제 값은 style.css의 CSS 변수(RGB 세 값)에 있어 다크 모드에서 저절로 바뀐다.
  // Stitch 버전(../stitch)의 토큰 이름이 원래 M3 색 역할 이름이라, 같은 이름에 M3 값을 넣었다.
  const v = (name) => `rgb(var(--md-${name}) / <alpha-value>)`;
  const roles = ['primary', 'on-primary', 'primary-container', 'on-primary-container', 'secondary', 'on-secondary', 'secondary-container', 'on-secondary-container',
    'tertiary', 'on-tertiary', 'tertiary-container', 'on-tertiary-container', 'error', 'on-error', 'error-container', 'on-error-container',
    'background', 'surface', 'on-surface', 'on-surface-variant', 'outline', 'outline-variant', 'inverse-surface', 'inverse-on-surface', 'inverse-primary',
    'surface-container-lowest', 'surface-container-low', 'surface-container', 'surface-container-high', 'surface-container-highest'];
  const colors = Object.fromEntries(roles.map((r) => [r, v(r)]));
  // Stitch 버전에만 있던 이름은 가장 가까운 M3 역할로
  Object.assign(colors, {
    'tertiary-fixed': v('tertiary-container'), 'tertiary-fixed-dim': v('tertiary'),
    hairline: v('outline-variant'), oat: v('tertiary-container'), amber: v('on-tertiary-container'), sage: v('outline-variant'),
    done: v('secondary-container'), sky: v('tertiary-container'), 'on-sky': v('on-tertiary-container')
  });
  tailwind.config = {
    theme: {
      extend: {
        colors,
        // M3 모양 크기: 작음 8 · 중간 12 · 큼 16 · 아주 큼 28
        borderRadius: { '2xl': '12px', lg: '16px', xl: '28px', full: '9999px' },
        fontFamily: {
          serif: ['Roboto', '"Noto Sans KR"', 'sans-serif'],
          sans: ['Roboto', '"Noto Sans KR"', 'sans-serif']
        },
        // M3 글자 크기
        fontSize: {
          'headline-xl': ['2rem', { lineHeight: '2.5rem' }],        // Headline large 32
          'headline-lg': ['1.5rem', { lineHeight: '2rem' }],        // Headline small 24
          'headline-md': ['1.375rem', { lineHeight: '1.75rem' }],   // Title large 22
          quote: ['1rem', { lineHeight: '1.5rem', letterSpacing: '0.03em' }],
          'body-md': ['1rem', { lineHeight: '1.5rem', letterSpacing: '0.03em' }],        // Body large 16
          'body-sm': ['0.875rem', { lineHeight: '1.25rem', letterSpacing: '0.016em' }],  // Body medium 14
          'label-md': ['0.75rem', { lineHeight: '1rem', letterSpacing: '0.04em' }],      // Label medium 12
          'label-sm': ['0.6875rem', { lineHeight: '1rem', letterSpacing: '0.045em' }],   // Label small 11
          'title-md': ['1rem', { lineHeight: '1.5rem', letterSpacing: '0.009em' }],      // Title medium 16
          'label-lg': ['0.875rem', { lineHeight: '1.25rem', letterSpacing: '0.006em' }]  // Label large 14
        }
      }
    }
  };
</script>
<link rel="stylesheet" href="../css/climate-chart.css">
<link rel="stylesheet" href="../css/achievements.css">
<link rel="stylesheet" href="../css/series.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-surface text-on-surface font-sans antialiased">
<div class="relative mx-auto min-h-[100dvh] w-full max-w-[560px] bg-surface">
  <main id="screen"></main>
  <div id="fab-slot"></div>
  <nav id="nav" aria-label="주 메뉴" class="fixed bottom-0 left-1/2 z-40 w-full max-w-[560px] -translate-x-1/2 bg-surface-container"></nav>
  <div id="layer"></div>
</div>
<noscript>이 앱은 자바스크립트가 필요합니다.</noscript>
<script src="../js/achievements-widget.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
